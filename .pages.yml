media:
  input: public
  output: /

content:
  - name: obras
    label: Obras
    type: collection
    path: src/data/obras
    format: yaml-frontmatter
    filename: "{slug}.md"
    
    # Configuración de la vista de lista
    view:
      primary: title # Campo principal (etiqueta) [2]
      fields: ["cover", "title", "year", "status"] # Campos que se mostrarán como columnas [2]
      default:
        sort: year # Opcional: ordena por año por defecto [2]
        order: desc

    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: year, label: Año, type: number }
      - { name: description, label: Descripción, type: text, required: false }
      
      - name: status
        label: Estado
        type: select
        options:
          values: [draft, published, archived]
        default: draft

      - { name: cover, label: Imagen principal, type: image }
      - { name: coverAlt, label: Texto alternativo, type: string }

      - name: mediaType
        label: Tipo de media
        type: select
        options:
          values: [image, video, iframe, model3d]
        default: image

      - name: mediaSrc
        label: Fuente del media
        # Cambiado a 'file' para habilitar el selector de medios y la carga de archivos [2, 6, 7]
        type: file 
        required: false
        # Ahora 'extensions' es válido porque el tipo es 'file' [1, 2]
        extensions: ["mp4", "webm", "glb", "gltf", "obj"]
        description: "Carga o selecciona el archivo de video (.mp4) o modelo 3D (.glb, .obj)"

      - { name: mediaAlt, label: Texto alternativo del media, type: string, required: false }

      - { name: modelAutoRotate, label: Rotación automática (3D), type: boolean, default: true, required: false }

      - { name: modelEnvironment, label: Iluminación de entorno (3D), type: string, required: false }

      - name: modelFiles
        label: Modelo(s) 3D (1 archivo = modelo simple, 2+ = LODs de mayor a menor calidad)
        type: list
        required: false
        of:
          type: file
          extensions: ["glb", "gltf"]

      - name: bento
        label: Tamaño en grid
        type: select
        options:
          values: [small, wide, tall, large]
        default: small

      - name: body
        label: Texto completo
        # La clave 'body' es especial: guarda el contenido fuera de los metadatos YAML [6, 8]
        type: rich-text 
        required: false

  - name: about
    label: About
    type: file
    path: src/data/about.md
    format: yaml-frontmatter

    fields:
      - name: title
        label: Título
        type: string

      - name: body
        label: Contenido
        # Mapea directamente al cuerpo del archivo Markdown [6, 8]
        type: rich-text 