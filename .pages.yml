media:
  input: public
  output: /

content:
  - name: obras
    label: Obras
    type: collection
    path: src/data/obras
    format: yaml-frontmatter
    filename: "{slug}.md"
    
    view:
      primary: title
      fields: ["cover", "title", "year", "status"]
      default:
        sort: year
        order: desc

    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: year, label: Año, type: number }
      - { name: description, label: Descripción, type: text, required: false }
      
      - name: status
        label: Estado
        type: select
        options:
          values: [draft, published, archived]
        default: draft

      - { name: cover, label: Imagen principal, type: image }
      - { name: coverAlt, label: Texto alternativo, type: string }

      # SISTEMA DINÁMICO DE MEDIA (Sustituye a mediaType y mediaSrc)
      - name: media_content
        label: Contenido de Media
        type: block # Permite elegir el esquema según el tipo [1]
        description: "Selecciona el tipo de contenido para mostrar los campos específicos"
        blocks:
          - name: imagen
            label: Imagen Estática
            fields:
              - { name: src, label: Archivo de imagen, type: image }
              - { name: alt, label: Texto alternativo, type: string }

          - name: video
            label: Video Reproducible
            fields:
              - name: src
                label: Archivo de video
                type: file
                extensions: ["mp4", "webm"]
              - { name: alt, label: Texto alternativo, type: string }

          - name: iframe
            label: Contenido Externo (Iframe)
            fields:
              - { name: url, label: URL del Iframe, type: string }

          - name: modelo_3d
            label: Objeto 3D
            fields:
              - name: main_model
                label: Modelo Principal
                type: file
                extensions: ["glb", "gltf", "obj"]
                description: "Archivo 3D base"
              
              # CONFIGURACIÓN FACILITADA PARA LOD
              - name: lods
                label: Niveles de Detalle (LOD)
                type: object
                list: # Permite repetir la selección [3]
                  collapsible:
                    summary: "{nivel} - {file}" # Muestra info rápida al colapsar [4]
                fields:
                  - name: nivel
                    label: Nivel
                    type: select
                    options:
                      values: [Bajo, Medio, Alto]
                  - name: file
                    label: Archivo del modelo
                    type: file
                    extensions: ["glb", "gltf", "obj"]

      - name: bento
        label: Tamaño en grid
        type: select
        options:
          values: [small, wide, tall, large]
        default: small

      - name: body
        label: Texto completo
        type: rich-text # Mapea al contenido Markdown fuera del frontmatter [5]
        required: false

  - name: about
    label: About
    type: file
    path: src/data/about.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Título, type: string }
      - { name: body, label: Contenido, type: rich-text }